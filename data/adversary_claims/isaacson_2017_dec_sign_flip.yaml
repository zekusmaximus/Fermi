# A second, independent upstream discrepancy, recorded so nobody "fixes" the flip by swapping
# in the other table wholesale. It is a difference between two published tables. Whether the
# telescope tracked the printed coordinate is NOT established here: that needs the filterbank
# headers of the observations, which have not been checked.
secondary_discrepancies:
  - id: enriquez_2017_692stars_minus_zero_sign_drop
    data_tier: published_catalog
    source: "https://seti.berkeley.edu/lband2017/692stars.csv"
    description: >-
      Three targets with a true declination in (-1, 0) deg are printed with a plus sign in
      692stars.csv. Isaacson et al. (2017) Table 1 has the correct sign.
    inherited_by_locked_catalog: false
    telescope_pointing_claim: "none (filterbank headers not verified)"
    records:
      - target_name: "HIP 99711"
        gaia_dr3_source_id: "4224259562941398400"
        catalog_dec_deg: -0.866667
        true_dec_deg: -0.866880
        truth_source: gaia_dr3
        raw_isaacson_dec: "-00 52 00"
        raw_692stars_dec: "+00:51:55.4"
      - target_name: "HIP 12530"
        gaia_dr3_source_id: "2498460442625153536"
        catalog_dec_deg: -0.695556
        true_dec_deg: -0.695652
        truth_source: gaia_dr3
        raw_isaacson_dec: "-00 41 44"
        raw_692stars_dec: "+00:41:46.3"
      - target_name: "HIP 82588"
        gaia_dr3_source_id: "4381250547575102208"
        catalog_dec_deg: -0.026389
