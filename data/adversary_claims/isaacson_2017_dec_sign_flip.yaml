# Isaacson et al. (2017) Table 1 declination sign flip (ruling v0.2.1-R5; forensic run
# v0.2.1c-diag, 2026-11-27). Values are data, not code branches: this file is the single
# canonical source of the 14 J2000 pointing corrections. It is SHA-256-pinned by
# data/surveys/bl_gbt_lband_background_gaia_dr3.yaml and applied as a NON-DESTRUCTIVE overlay
# when background cones are fetched and de-duplicated. The locked primary catalog
# (data/catalogs/bl_692_targets.csv) is never edited.
id: isaacson_2017_dec_sign_flip
ruling: "v0.2.1-R5"
pointing_group_id: bl_gbt_lband_2017
claim: >-
  Table 1 of Isaacson et al. (2017) prints every target whose true declination lies in
  (-11 deg, -10 deg] without its minus sign. The published table has 0 rows with a
  declination degree field of -10 and 35 with +10. The locked bl_692_targets.csv takes its
  coordinates from that table, so 14 of the 692 Enriquez et al. (2017) targets sit
  20.1 - 21.9 deg north of the star that was observed.
locked_catalog:
  path: "data/catalogs/bl_692_targets.csv"
  sha256: "c299d61df3cd5f7eb9f2a28111fbcb1ae0c375a1dc7f219b2e86fdb005716ee2"
  policy: >-
    immutable (rulings v0.2.1-R3 and v0.2.1-R5): the catalog keeps the published coordinates
    verbatim; corrections live in this overlay only
# Expected state of the LOCKED catalog (recounted offline by audit_catalog_dec_sign_flip).
catalog_band_census:
  flipped_band_deg: [10.0, 11.0]      # [lo, hi)
  n_targets_in_flipped_band: 16       # 14 flipped + 2 genuine northern controls
  mirror_band_deg: [-11.0, -10.0]     # [lo, hi)
  n_targets_in_mirror_band: 0
# The sign-restored catalog position (ra_deg, -dec_deg) must lie within this distance of the
# recorded J2000 truth for every correction.
match_tolerance_arcsec: 2.0
overlay_rule: >-
  For each entry of pointing_corrections the cone centre and the primary position used by the
  de-duplication step are (true_ra_deg, true_dec_deg), J2000. Every other pointing keeps its
  published catalog coordinates.
evidence:
  - label: isaacson_2017_vizier_table1
    data_tier: published_catalog
    source: "VizieR J/PASP/129/E4501/table1 (Isaacson et al. 2017, PASP 129, 054501), vizier.cfa.harvard.edu asu-tsv"
    retrieved_at_utc: "2026-11-27"
    n_unique_targets: 1702
    n_dec_degree_field_minus_10: 0
    n_dec_degree_field_plus_10: 35
    n_hip_targets_with_true_dec_in_mirror_band: 21
    n_of_those_printed_with_plus_sign: 21
    note: >-
      Neighbouring degree fields hold 8 - 15 rows each; -09, -11, -12 and -00 carry their
      signs. All 21 Hipparcos stars of the table whose true declination is in (-11, -10] deg
      are printed as +10 (checked against VizieR I/311/hip2); 14 of them are in the 692-star
      Enriquez et al. (2017) L-band sample.
  - label: isaacson_2017_arxiv_source
    data_tier: published_catalog
    source: "arXiv:1701.06227 e-print, file table1709_4paper.txt (\\input by BL_targetlist.tex)"
    retrieved_at_utc: "2026-11-27"
    eprint_sha256: "6cb20619f5ee4fabcb2de80aa3e7c46164d3e4c7b20d2f33f3740b528b6fedc8"
    n_dec_degree_field_minus_10: 0
    n_dec_degree_field_10_unsigned: 35
    note: >-
      The authors' own table already lacks the sign (e.g. "HIP103388 & 20:56:46.6 & 10:26:54"),
      so the error predates the CDS ingestion. The IOP machine-readable table and the CDS
      table1.dat / ReadMe could not be fetched on 2026-11-27 and were not compared.
  - label: enriquez_2017_692stars_csv
    data_tier: published_catalog
    source: "https://seti.berkeley.edu/lband2017/692stars.csv (Enriquez et al. 2017 target list)"
    retrieved_at_utc: "2026-11-27"
    file_sha256: "11abacadebf8285a58c6b56903f0b63448e8ac3a38dace92effc85ebf783ae9e"
    note: >-
      Gives the correct -10 deg declination for all 14 flipped targets. scripts/fetch_bl_692.py
      reads only its name column, so these coordinates never reached bl_692_targets.csv.
truth_sources:
  gaia_dr3:
    data_tier: reproduced_archive
    source: "ARI Heidelberg Gaia TAP, gaiadr3.gaia_source, by the catalog's gaia_dr3_source_id"
    queried_at_utc: "2026-11-27"
    code_git_sha: "d6c1ff5401db6358d982d4c8a184d88dd1c688ba"   # clean tree, read-only v0.2.1c-diag
    epoch: "J2000.0: epoch 2016.0 positions propagated linearly with pmra / cos(dec) and pmdec"
    precision_note: "recorded to 1e-6 deg (3.6 mas) as printed by the diagnostic"
  hip2:
    data_tier: reproduced_archive
    source: "VizieR I/311/hip2 (van Leeuwen 2007), by Hipparcos number"
    queried_at_utc: "2026-11-27"
    code_git_sha: "d6c1ff5401db6358d982d4c8a184d88dd1c688ba"
    epoch: "J2000.0: epoch 1991.25 positions propagated linearly with pmRA / cos(dec) and pmDE"
    precision_note: "recorded to 1e-6 deg (3.6 mas) as printed by the diagnostic"
# gaia_dr3_source_id is a quoted decimal string (ruling v0.2.1-R4) or null.
