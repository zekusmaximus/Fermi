id: partial_dyson_conspicuous
name: "Conspicuous Partial Dyson Spheres"
tier: 1
summary: "Partial Dyson spheres are as common as current mid-IR upper limits allow and most are conspicuous in WISE W3/W4."
parameter_constraints:
  ir_host_fraction: { mode: fixed, value: 1.0e-5 }
  ir_conspicuous_fraction: { mode: range, min: 0.1, max: 1.0 }
channels_activated: ["infrared"]
falsification_condition: "Calibrated mid-IR candidate counts consistent with false positives alone push likelihood ratio below 1e-3."
benchmark_notes: >-
  ir_host_fraction = 1e-5 sits at the most constraining Suazo et al. (2022) upper
  limit (~1 in 100,000 stars) as quoted in Suazo et al. 2024 Section 1. The
  ir_conspicuous_fraction range is marginalised under its log-uniform prior.
citations:
  - "Suazo et al. 2024, MNRAS 531, 695 (arXiv:2405.02927)"
  - "Suazo et al. 2022 (Project Hephaistos I)"
