id: quiet_expanders
name: "Quiet Expanders"
tier: 1
summary: "Settlement proceeds as in the frequent/slow benchmark but leaves no detectable radio, waste-heat, or Solar System signature."
parameter_constraints:
  origin_rate_per_kpc2_gyr: { mode: fixed, value: 4.0 }
  expansion_speed_c: { mode: fixed, value: 0.005 }
  radio_detect_prob: { mode: fixed, value: 0.0 }
  ir_conspicuous_fraction: { mode: fixed, value: 0.0 }
  solar_system_artifact_detect_prob: { mode: fixed, value: 0.0 }
channels_activated: ["radio", "infrared", "solar_system"]
falsification_condition: "Not falsifiable by null photon-channel data alone (all emission probabilities are zero); serves as the zero-emission reference."
benchmark_notes: >-
  An expansion hypothesis: its IR host fraction is derived (P(star reached) *
  f_ir_loud) and is identically 0 because f_ir_loud = 0. Every likelihood ratio
  vs. its null must equal 1.0 (zero-emission reference).
citations:
  - "Suazo et al. 2024, MNRAS 531, 695 (arXiv:2405.02927)"
